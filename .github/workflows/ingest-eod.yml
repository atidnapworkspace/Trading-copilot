name: Ingest US EOD

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/ingest-eod.yml"
      - "pipeline/src/tcp/jobs/ingest_eod.py"
      - "pipeline/src/tcp/polygon.py"
  schedule:
    - cron: "0 6 * * 2-6"   # Tue-Sat 06:00 UTC: loads the previous US session

concurrency:
  group: ingest-eod
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r pipeline/requirements.txt
      - run: python -m pytest pipeline/tests -q
      - name: Ingest EOD (resumable, newest dates first)
        env:
          PYTHONPATH: pipeline/src
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          LOOKBACK_DAYS: "370"
          MAX_MINUTES: "100"
        run: python -m tcp.jobs.ingest_eod
      - name: Commit result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ingest-eod-result.md
          git commit -m "EOD ingest result" || echo "nothing to commit"
          git pull --rebase
          git push
